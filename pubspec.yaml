name: pace
description: "P.A.C.E. – Panic Alert & Coordinate Emergency. AI-Enabled Smart Women's Safety Wearable System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase (uncomment when Firebase project is configured)
  # firebase_core: any
  # firebase_auth: any
  # cloud_firestore: any
  # firebase_messaging: any
  # firebase_storage: any

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Bluetooth
  flutter_blue_plus: ^1.35.5

  # Maps & Location
  google_maps_flutter: ^2.12.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Networking
  dio: ^5.7.0

  # Dependency Injection
  get_it: ^8.0.3

  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

dependency_overrides:
  path_provider_foundation: 2.5.1
